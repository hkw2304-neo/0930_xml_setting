[versions]
agp = "8.5.2"
kotlin = "2.0.21"
coreKtx = "1.13.1"
appcompat = "1.7.0"
material = "1.12.0"
constraintlayout = "2.1.4"
lifecycle = "2.8.6"
navigationFragment = "2.8.2"
retrofit = "2.11.0"
okhttp = "4.12.0"
coil = "2.7.0"
photoview = "2.3.0"
androidPdfViewer = "3.2.0-beta.3"
splashScreen = "1.0.1"

[libraries]
# ==========================================
# 1. AndroidX Core & UI 기본 구성 요소
# ==========================================
# 코틀린 언어 확장 코어 라이브러리 (안드로이드 기본 API 간소화)
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
# 하위 버전 호환성을 지원하는 기본 액티비티/앱바 구성 요소
androidx-appcompat = { group = "androidx.appcompat", name = "appcompat", version.ref = "appcompat" }
# 구글 마테리얼 디자인 컴포넌트 (Button, Card, BottomSheet 등)
material = { group = "com.google.android.material", name = "material", version.ref = "material" }
# 제약 조건 기반의 XML 레이아웃 컴포넌트
constraintlayout = { group = "androidx.constraintlayout", name = "constraintlayout", version.ref = "constraintlayout" }
# 앱 시작 시 렌더링되는 공식 스플래시 스크린 라이브러리
androidx-splashscreen = { group = "androidx.core", name = "core-splashscreen", version.ref = "splashScreen" }

# ==========================================
# 2. Lifecycle & Navigation (아키텍처)
# ==========================================
# 생명주기(Lifecycle) 코루틴 스코프 지원 (lifecycleScope 사용)
androidx-lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycle" }
# ViewModel 내 코루틴 지원 (viewModelScope 사용)
lifecycle-viewmodel-ktx = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-ktx", version.ref = "lifecycle" }
# 프래그먼트 기반 네비게이션 이동 제어
navigation-fragment-ktx = { group = "androidx.navigation", name = "navigation-fragment-ktx", version.ref = "navigationFragment" }
# 네비게이션과 UI(BottomNavigationView, Toolbar 등) 연동
navigation-ui-ktx = { group = "androidx.navigation", name = "navigation-ui-ktx", version.ref = "navigationFragment" }

# ==========================================
# 3. 네트워크 통신 (Network)
# ==========================================
# REST API 통신용 Retrofit 코어
retrofit = { group = "com.squareup.retrofit2", name = "retrofit", version.ref = "retrofit" }
# Retrofit 응답(JSON)을 Kotlin 객체(Data Class)로 자동 변환하는 Gson 컨버터
retrofit-converter-gson = { group = "com.squareup.retrofit2", name = "converter-gson", version.ref = "retrofit" }
# HTTP 클라이언트 OkHttp 코어
okhttp = { group = "com.squareup.okhttp3", name = "okhttp", version.ref = "okhttp" }
# 네트워크 요청/응답 결과(Header, Body)를 Logcat에 출력해 주는 인터셉터
okhttp-logging-interceptor = { group = "com.squareup.okhttp3", name = "logging-interceptor", version.ref = "okhttp" }

# ==========================================
# 4. 이미지 처리 & 뷰어 (Media & Visual)
# ==========================================
# 코루틴 기반의 경량화 이미지 로딩 라이브러리
coil = { group = "io.coil-kt", name = "coil", version.ref = "coil" }
# ImageView에 줌(Zoom in/out) 및 터치 제스처 기능을 추가해 주는 라이브러리
photoview = { group = "com.github.chrisbanes", name = "PhotoView", version.ref = "photoview" }

# ==========================================
# 5. 문서 뷰어 (Document)
# ==========================================
# 안드로이드 내에서 PDF 파일을 렌더링하고 보여주는 라이브러리
android-pdf-viewer = { group = "com.github.mhiew", name = "android-pdf-viewer", version.ref = "androidPdfViewer" }

[plugins]
# 안드로이드 애플리케이션 빌드 플러그인
android-application = { id = "com.android.application", version.ref = "agp" }
# 안드로이드 프로젝트용 코틀린 컴파일러 플러그인
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }